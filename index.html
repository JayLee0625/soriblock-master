<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4CA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="소리블록 마스터">
<title>소리블록 마스터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#F3F6FC;--card:#FFFFFF;--ink:#10203F;--sub:#55627C;--mute:#98A2B6;--line:#E0E7F2;
  --main:#0F4CA8;--main-soft:#E3ECFA;--amber:#F26300;--amber-soft:#FFEADB;
  --good:#2E9A6B;--good-soft:#E3F4EC;--warn:#C98A00;--warn-soft:#FFF5D1;--bad:#D64545;--bad-soft:#FBE7E7;
  --chip:#E9EEF7;--shadow:0 1px 2px rgba(16,32,63,.06),0 6px 20px rgba(16,32,63,.07);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1424;--card:#152035;--ink:#E6ECF7;--sub:#A7B3CA;--mute:#6A7792;--line:#233150;
  --main:#5B95F0;--main-soft:#182A4A;--amber:#FF8A3D;--amber-soft:#3A2414;
  --good:#4CC28F;--good-soft:#173326;--warn:#F2C230;--warn-soft:#3A3112;--bad:#F06A6A;--bad-soft:#3A1C1C;
  --chip:#1D2944;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--main)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(12px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
.top{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:8px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--chip)}
.ib svg{width:24px;height:24px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;font-weight:700;background:var(--main);color:#fff;width:100%}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.amber{background:var(--amber);color:#fff}
.btn.bad{background:var(--bad)}
.btn.sm{height:40px;padding:0 14px;border-radius:12px;font-size:14px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.muted{color:var(--sub)}
.small{font-size:13px}
.center{text-align:center}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.logo{display:block;flex:none;border-radius:22%;background:#fff;box-shadow:0 1px 3px rgba(16,32,63,.12)}
.logo.anim{animation:pop .8s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.logo.anim{animation:none}}
/* entry */
.entry{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.entry h2{font-size:26px;margin:8px 0 0;letter-spacing:-.4px}
.entry p{margin:0 0 10px}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.rn{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rnb{height:46px;padding:0 14px 0 16px;font-size:16px;font-weight:700;color:var(--ink)}
.rnx{width:38px;height:46px;font-size:20px;color:var(--sub);border-left:1px solid var(--line)}
/* home */
.today{display:flex;align-items:center;gap:14px}
.today .num{font-size:30px;font-weight:800;letter-spacing:-.5px}
.today .num small{font-size:15px;color:var(--sub);font-weight:700}
.stamp{width:64px;height:64px;flex:none}
.part{display:block;width:100%;text-align:left}
.part h3{margin:0 0 4px;font-size:17px}
.bar{height:8px;border-radius:8px;background:var(--chip);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--main);border-radius:8px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--main-soft);color:var(--main)}
.expr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
.expr:last-child{border-bottom:0}
.expr b{flex:1;font-size:16px}
.expr .small{flex:none}
.pill{flex:none;min-width:40px;height:26px;padding:0 9px;border-radius:13px;display:inline-grid;place-items:center;font-size:12px;font-weight:800;background:var(--chip);color:var(--sub)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
/* practice */
.pbar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;background:var(--amber)}
.ko{font-size:24px;line-height:1.5;font-weight:700;letter-spacing:-.3px;margin:10px 0 4px;word-break:keep-all}
.hintline{font-size:18px;color:var(--sub);letter-spacing:.3px;min-height:27px;word-break:keep-all}
.hintline .bl{display:inline-block;min-width:26px;border-bottom:2px solid var(--mute);margin:0 3px;height:18px;vertical-align:-2px}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 4px}
.mic{width:88px;height:88px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(242,99,0,.32);position:relative}
.mic svg{width:38px;height:38px}
.mic.rec{background:var(--bad);box-shadow:0 8px 24px rgba(214,69,69,.32)}
.mic[disabled]{opacity:.7}
.mic svg,.mic .spin{position:relative;z-index:1}
.lvl{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.18);transition:transform .08s linear;pointer-events:none}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 0.8s linear infinite;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.swrow{display:flex;align-items:center;gap:10px;font-weight:700;padding:6px 0}
.swrow input{width:22px;height:22px;accent-color:var(--main)}
.mic.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);opacity:.5;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.live{font-size:15px;color:var(--sub);text-align:center;min-height:23px;padding:0 8px}
.subbtns{display:flex;gap:8px;margin-top:14px}
.subbtns button{flex:1;height:44px;border-radius:13px;background:var(--chip);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.subbtns button svg{width:18px;height:18px}
.subbtns button.playing{background:var(--main);color:#fff}
.verdict{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin-bottom:8px}
.verdict .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.verdict.O{color:var(--good)}.verdict.O .ic{background:var(--good-soft)}
.verdict.T{color:var(--warn)}.verdict.T .ic{background:var(--warn-soft)}
.verdict.X{color:var(--bad)}.verdict.X .ic{background:var(--bad-soft)}
.en{font-size:21px;line-height:1.5;font-weight:700;word-break:keep-all}
.en .miss{color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:5px}
.en .hit{color:var(--good)}
.said{font-size:15px;color:var(--sub);margin-top:6px}
.said .ex{color:var(--bad);text-decoration:line-through}
.alt{font-size:14px;color:var(--sub);margin-top:6px}
.nav{display:flex;gap:8px;margin-top:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sum div{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.sum b{display:block;font-size:24px}
.wl{padding:10px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:0}
.wl .k{font-weight:700}
.wl .e{color:var(--sub);font-size:15px}
/* admin */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;height:42px;border-radius:12px;background:var(--chip);font-weight:700;font-size:14px}
.tabs button.on{background:var(--main);color:#fff}
label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 6px}
.sl{display:flex;gap:12px;align-items:center;width:100%;padding:12px 4px;border-bottom:1px solid var(--line)}
.sl:last-child{border-bottom:0}
.sl .tx{flex:1;min-width:0}
.vrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vtx b{font-size:15px}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--chip);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--sub);flex:none}
.chip.on{background:var(--main);color:#fff}
.chip svg{width:13px;height:13px;flex:none}
.chip[disabled]{opacity:.45}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.radio.on{border-color:var(--main)}
.radio.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--main)}
.modal{position:fixed;inset:0;background:rgba(8,14,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + var(--safe-b));max-height:90vh;overflow:auto}
.kbar{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.kbar a{color:var(--ink);white-space:nowrap}
.note{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.prog{height:10px;border-radius:10px;background:var(--chip);overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--main);transition:width .3s}
.empty{padding:28px 8px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
